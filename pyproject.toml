[project]
name = "creditguard-ai"
version = "0.1.0"
description = "CreditGuard AI — production-grade credit risk prediction system with XGBoost, SHAP, and Streamlit."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Muhammaddiyor Tolibjonov", email = "mtd.coder@gmail.com" }]
keywords = ["credit-risk", "machine-learning", "xgboost", "shap", "streamlit", "fintech"]

dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.3",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "imbalanced-learn>=0.13.0",
    "optuna>=4.0.0",
    "shap>=0.46.0",
    "plotly>=5.24.0",
    "streamlit>=1.39.0",
    "matplotlib>=3.9.0",
    "joblib>=1.4.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "openml>=0.15.1",
    "reportlab>=4.2.5",
    "python-dateutil>=2.9.0",
    "fastparquet>=2024.5.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
creditguard = "creditguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creditguard"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks", "data", "models", "reports"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = ["E501", "B008", "N803", "N806", "C408", "UP017", "SIM108", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"streamlit_app.py" = ["E402"]
"src/creditguard/app/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["notebooks/", "build/", "dist/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src/creditguard"]
omit = ["src/creditguard/app/*", "tests/*"]
